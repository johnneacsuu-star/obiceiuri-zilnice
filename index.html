<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A4D">

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--navy:#1F3A4D;--gold:#D9A441;--cream:#F7F1E6;--bg:#8A7B63;--line:#E7DDCB;--card:#FFFDF8;--soft:#EFE6D6;--navy2:#6F8FA3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--navy);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.4;font-size:16px}
button{font-family:inherit;color:inherit}
.top{background:var(--navy);color:var(--cream);padding:calc(12px + env(safe-area-inset-top)) 14px 14px}
.top h1{margin:0;font:normal 1.35rem Georgia,"Times New Roman",serif}
.top .sub{color:#d8cfbf;font-size:.85rem}
main{max-width:560px;margin:0 auto;padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2.title{font:normal 1.15rem Georgia,serif;margin:0 0 10px}
.datenav{display:flex;align-items:center;gap:8px}
.datenav .lbl{flex:1;text-align:center;font-weight:600;font-size:1.02rem}
.datenav .lbl small{display:block;font-weight:400;color:var(--bg);font-size:.8rem}
.iconbtn{width:46px;height:46px;border-radius:12px;border:1px solid var(--bg);background:#fff;font-size:1.4rem;display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:disabled{opacity:.35}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:none;background:var(--navy);color:var(--cream);font-size:.95rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--bg)}
.btn.gold{background:var(--gold);color:var(--navy)}
input[type=date],input[type=time],input[type=text],input[type=number]{min-height:44px;border:1px solid var(--bg);border-radius:10px;padding:6px 10px;font-size:1rem;font-family:inherit;color:var(--navy);background:#fff;max-width:100%}
input[type=text]{width:100%}
.banner{background:var(--gold);color:var(--navy);border-radius:12px;padding:12px 14px;font-weight:600;margin:10px 0 0;font-size:1.02rem}
.hint{color:var(--bg);font-size:.86rem;margin:6px 0 0}
.score{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.score .big{font:normal 2.2rem Georgia,serif;white-space:nowrap}
.score .big small{font-size:1rem;color:var(--bg)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1;min-width:220px}
.mini{background:var(--soft);border-radius:10px;padding:5px 8px;font-size:.8rem;display:flex;justify-content:space-between;gap:4px}
.mini b{white-space:nowrap}
.mini.full{background:var(--gold)}
.group{margin-bottom:14px}
.group>.gh{position:sticky;top:0;z-index:5;background:var(--navy);color:var(--cream);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;box-shadow:0 2px 6px rgba(31,58,77,.18)}
.group>.gh .gn{font:normal 1.08rem Georgia,serif}
.group>.gh .gd{font-size:.78rem;color:#d8cfbf;display:block;font-family:"Segoe UI",system-ui,sans-serif}
.group>.gh .gs{white-space:nowrap;font-size:.85rem;background:rgba(247,241,230,.15);border-radius:20px;padding:2px 10px}
.group.focus>.gh{box-shadow:0 0 0 3px var(--gold),0 2px 6px rgba(31,58,77,.18)}
.group.focus .habit{border-color:var(--gold)}
.gbadge{display:none;align-items:center;gap:5px;font-size:.8rem;font-weight:700;background:var(--navy);color:var(--gold);border-radius:20px;padding:2px 10px 2px 6px;white-space:nowrap}
.gbadge svg{width:16px;height:16px}
.group.gold>.gh{background:linear-gradient(135deg,#E6B85C,#D9A441 60%,#C99434);color:var(--navy)}
.group.gold>.gh .gd{color:#3b4c57}
.group.gold>.gh .gs{display:none}
.group.gold>.gh .gbadge{display:inline-flex}
.group.gold .habit{border-color:#E8C987;background:#FFF9EC}
.group.pop>.gh{animation:goldglow 1.4s ease-out 1}
@keyframes goldglow{0%{box-shadow:0 0 0 0 rgba(217,164,65,.75);transform:scale(1)}35%{transform:scale(1.025)}100%{box-shadow:0 0 0 16px rgba(217,164,65,0);transform:scale(1)}}
.sun{display:none}
.score.goldday .sun{display:block;width:74px;height:74px;flex:0 0 74px}
.score.goldday .sun .rays{transform-origin:50px 50px;animation:spin 40s linear infinite}
.score.goldday.pop .sun{animation:sunrise 1.6s ease-out 1}
@keyframes sunrise{0%{transform:translateY(14px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.dayname{display:none;font:normal 1.05rem Georgia,serif;color:#9a6f1f}

.goldcard{background:linear-gradient(180deg,#FFF6E2,#FFFDF8);border-color:#EAD3A0}
.gweek{background:var(--gold);color:var(--navy);border-radius:12px;padding:12px 14px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.gweek svg{width:34px;height:34px}
.gweek svg .rays{stroke:#1F3A4D}
.gweek svg circle{fill:#1F3A4D;stroke:#1F3A4D}
.grow{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,26px) 30px;gap:4px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.grow:last-child{border-bottom:none}
.gc{width:26px;height:26px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:.62rem;color:var(--bg)}

.gcount{text-align:right;font-weight:700}
.ghead{color:var(--bg);font-size:.72rem;text-align:center}

#syncInd.err{color:#F3C77A}
.deskbtns{display:none;gap:8px}

.deskbtns button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.syncst{font-size:.9rem;margin-top:8px;color:var(--navy)}

.habit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.hh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hh .hn{flex:1;font-weight:600;font-size:.98rem}
.dot{width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.dot svg{display:none}
.dot.on{background:var(--gold);border-color:var(--gold)}
.dot.on svg{display:block}
.q{font-size:.86rem;color:var(--bg);margin:8px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;min-width:52px;padding:0 12px;border-radius:22px;border:1px solid var(--bg);background:#fff;font-size:.95rem;cursor:pointer}
.chip.on{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.chip.lite{border-style:dashed}
.check{display:flex;align-items:center;gap:10px;min-height:46px;padding:4px 8px;border-radius:10px;cursor:pointer;width:100%;background:transparent;border:none;text-align:left;font-size:.96rem}

.check .bx svg{display:none}.check.on .bx svg{display:block}
.check.on .tx{color:var(--bg);text-decoration:line-through}

.stepper button{width:52px;height:46px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stepper span{min-width:80px;text-align:center;font-weight:600}
.tline{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:.86rem;color:var(--bg)}
.wake{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:8px}
.wake h3{margin:0 0 4px;font:normal 1rem Georgia,serif}
.jin{margin-bottom:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--bg);padding:6px 0;cursor:pointer;min-height:52px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--navy);font-weight:600}
nav.tabs button.on svg{stroke:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--bg);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.hrow{border-top:1px solid var(--line);padding:10px 0}
.hrow:first-child{border-top:none}
.hrow .t{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.92rem}
.cells{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:6px 0 4px}
.cell{height:34px;border-radius:8px;background:var(--soft);border:none;font-size:.7rem;color:var(--bg);cursor:pointer;padding:0}
.cell.on{background:var(--navy);color:var(--cream)}
.hrow.held .cell.on{background:var(--gold);color:var(--navy)}
.cell.today{outline:2px solid var(--gold);outline-offset:1px}
.cell.fut{opacity:.45;cursor:default}
.streak{font-size:.8rem;color:var(--bg)}
.badge{display:inline-block;font-size:.78rem;padding:3px 10px;border-radius:20px;background:var(--soft);white-space:nowrap}
.badge.ok{background:var(--gold);color:var(--navy);font-weight:600}
table.tot{width:100%;border-collapse:collapse;font-size:.9rem}
table.tot td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.tot td:last-child{text-align:right;font-weight:600;white-space:nowrap}
.set{padding:10px 0;border-bottom:1px solid var(--line)}
.set label{display:block;font-size:.86rem;color:var(--bg);margin-bottom:4px}
.set:last-child{border-bottom:none}
.pct{font:normal 1.8rem Georgia,serif}
.barw{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:4px 0 10px}
.barw div{height:100%;background:var(--gold)}
svg text{font-family:"Segoe UI",system-ui,sans-serif}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30;font-size:.9rem}
#toast.show{opacity:1}
footer{text-align:center;color:var(--bg);font-size:.8rem;padding:6px 0 0}
@media (min-width:1000px){
 .top{display:flex;align-items:center;justify-content:space-between;padding:14px 28px}
 .top .tl{flex:1}
 #syncInd{float:none;display:block}
 .deskbtns{display:flex}
 nav.tabs{display:none}
 main{padding-bottom:30px}
 main.desk{max-width:1400px;display:grid;grid-template-columns:minmax(440px,5fr) minmax(0,6fr);gap:22px;align-items:start;padding:18px 24px}
 main.desk .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
 main.desk .rgrid .card{margin-bottom:0}
 main.desk .span2{grid-column:1/3}
 main.set{max-width:760px}
 #toast{bottom:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="tl"><h1>Obiceiurile mele</h1>
  <div class="sub"><span id="syncInd"></span>O zi bună începe din seara de dinainte.</div></div>
  <div class="deskbtns" id="deskbtns"><button data-tab="azi" class="on">Panou</button><button data-tab="set">Setări</button></div>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="azi" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg>Azi</button>
  <button data-tab="sapt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M10 20V7M15 20v-6M20 20V4"/></svg>Săptămâna</button>
  <button data-tab="kpi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>KPI</button>
  <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Setări</button>
</nav>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
(function(){
"use strict";
var KEY="johnObiceiuri.v2";
var ZILE=["Lun","Mar","Mie","Joi","Vin","Sâm","Dum"];
var ZL=["duminică","luni","marți","miercuri","joi","vineri","sâmbătă"];
var LUNI=["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"];
var LS=["ian","feb","mar","apr","mai","iun","iul","aug","sep","oct","noi","dec"];
var GROUPS=[
 {id:"seara",name:"Seara de dinainte",short:"Seara",habits:["h1","h2","h3"],color:"#1F3A4D"},
 {id:"dim",name:"Dimineața",short:"Dimineața",habits:["h4","h5","h6"],color:"#D9A441"},
 {id:"zi",name:"Câștig ziua",short:"Ziua",habits:["h7","h8","h9"],color:"#8A7B63"},
 {id:"job",name:"Job, bani și business",short:"Job și bani",habits:["h10","h11","h12"],color:"#6F8FA3"}];
var ALL=["h1","h2","h3","h4","h5","h6","h7","h8","h9","h10","h11","h12"];
var DEF_SETTINGS={targets:{room:"22:30",bed:"23:00",phone:"21:30",moveMin:10,moveBy:"07:00",socialMax:60,businessMin:60,week:5},business:"GroundsBids",labels:{},goldWeek:5,
 gold:{seara:"Seară de aur",dim:"Răsărit de aur",zi:"Zi câștigată",job:"Buget și drum de aur",day:"Zi de aur",week:"Săptămână de aur"}};
var DEF_GOLD=JSON.parse(JSON.stringify(DEF_SETTINGS.gold));
var SUN='<svg viewBox="0 0 100 100" aria-hidden="true"><g class="rays" stroke="#D9A441" stroke-width="6" stroke-linecap="round"><path d="M50 4v12M50 84v12M4 50h12M84 50h12M17.5 17.5l8.5 8.5M74 74l8.5 8.5M17.5 82.5l8.5-8.5M74 26l8.5-8.5"/></g><circle cx="50" cy="50" r="24" fill="#D9A441"/><circle cx="50" cy="50" r="24" fill="none" stroke="#F3DDAA" stroke-width="3"/></svg>';
var SUNS='<svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="#D9A441" stroke-width="9" stroke-linecap="round"><path d="M50 6v14M50 80v14M6 50h14M80 50h14M19 19l10 10M71 71l10 10M19 81l10-10M71 29l10-10"/></g><circle cx="50" cy="50" r="22" fill="#D9A441"/></svg>';
var TICK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 7"/></svg>';
var TICKW=TICK.replace('currentColor','#F7F1E6');
var MINUS='<svg width="20" height="20" viewBox="0 0 24 24" stroke="#1F3A4D" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg>';
var PLUS='<svg width="20" height="20" viewBox="0 0 24 24" stroke="#1F3A4D" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>';

function pad(n){return n<10?"0"+n:""+n;}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parse(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function monday(d){return addDays(d,-((d.getDay()+6)%7));}
function t2m(t){var p=String(t).split(":");return (+p[0])*60+(+p[1]);}
function ev(t){var m=t2m(t);return m<720?m+1440:m;}
function m2t(m){m=((Math.round(m)%1440)+1440)%1440;return Math.floor(m/60)+":"+pad(m%60);}
function fmtT(t){return t?m2t(t2m(t)):"";}
function nowT(){var n=new Date();return pad(n.getHours())+":"+pad(n.getMinutes());}
function dShort(d){return ZL[d.getDay()]+" "+d.getDate()+" "+LS[d.getMonth()];}
function dLong(d){return ZL[d.getDay()]+", "+d.getDate()+" "+LUNI[d.getMonth()];}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function minText(n){n=+n;if(n===60)return "o oră";if(n%60===0)return (n/60)+" ore";return n+(n>=20?" de minute":" minute");}
function zile(n){return n===1?"1 zi":n+" zile";}
function isEvening(){return new Date().getHours()>=17;}

var S=load();
var tab="azi";
var sel=isEvening()?addDays(today(),1):today();
var ws=monday(sel);

function load(){
  var s=null;try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!s||typeof s!=="object"||!s.records)s={version:2,records:{}};
  s.settings=merge(JSON.parse(JSON.stringify(DEF_SETTINGS)),s.settings||{});
  return s;
}
function merge(a,b){for(var k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object")merge(a[k],b[k]);else a[k]=b[k];}return a;}
function save(){S.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(S));schedSync();}
function touch(r){r.updatedAt=Date.now();}
function touchSettings(){S.settingsUpdatedAt=Date.now();}
function goldName(k){var v=S.settings.gold&&S.settings.gold[k];return v&&String(v).trim()?String(v).trim():DEF_GOLD[k];}
function T(){return S.settings.targets;}
function rec(k){return S.records[k]||{};}
function wrec(k){return S.records[k]||(S.records[k]={});}
function getPath(o,p){return p.split(".").reduce(function(a,k){return a==null?undefined:a[k];},o);}
function setPath(o,p,v){var ks=p.split("."),c=o;for(var i=0;i<ks.length-1;i++){if(c[ks[i]]==null)c[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{};c=c[ks[i]];}if(v===undefined||v===null||v==="")delete c[ks[ks.length-1]];else c[ks[ks.length-1]]=v;}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("show");},2000);}
function filled(a){return (a||[]).filter(function(x){return x&&String(x).trim();}).length;}
function maxDay(){return addDays(today(),1);}

function defLabel(id){var t=T();return {
 h1:"În cameră până la "+fmtT(t.room)+", în pat până la "+fmtT(t.bed),
 h2:"Telefonul pus deoparte până la "+fmtT(t.phone),
 h3:"Jurnal 3 + 3",
 h4:"Fără telefon în prima oră",
 h5:"Duș rece",
 h6:"Mișcare până la "+fmtT(t.moveBy),
 h7:"Social media sub "+minText(t.socialMax),
 h8:"Protocolul R",
 h9:"Mese după plan",
 h10:"Ziua de job planificată în calendar",
 h11:"Zero cheltuieli neplanificate",
 h12:(S.settings.business||"Business nou")+", cel puțin "+minText(t.businessMin)}[id];}
function label(id){var l=S.settings.labels[id];return l&&l.trim()?l.trim():defLabel(id);}

function done(id,r){r=r||{};var t=T(),j,m;
 switch(id){
 case"h1":return !!(r.room&&r.bed&&ev(r.room)<=ev(t.room)&&ev(r.bed)<=ev(t.bed));
 case"h2":return !!(r.phone&&ev(r.phone)<=ev(t.phone));
 case"h3":j=r.journal||{};return j.paper?((j.gc||0)>=3&&(j.tc||0)>=3):(filled(j.g)>=3&&filled(j.t)>=3);
 case"h4":return r.noPhone===true;
 case"h5":return (r.shower||0)>0;
 case"h6":return (r.move||0)>=t.moveMin&&r.before7!==false;
 case"h7":return r.social!=null&&r.social<=t.socialMax;
 case"h8":return r.pr===true;
 case"h9":m=r.meals||{};return !!(m.prep&&m.snack&&m.sugar&&m.pastry);
 case"h10":return r.job===true;
 case"h11":return r.spend===true&&!(r.amount>0);
 case"h12":return (r.biz||0)>=t.businessMin;}
 return false;}
function dayScore(k){var r=rec(k);return ALL.filter(function(h){return done(h,r);}).length;}
function groupScore(g,k){var r=rec(k);return g.habits.filter(function(h){return done(h,r);}).length;}
function isGoldG(g,k){return groupScore(g,k)===3;}
function isGoldDay(k){return dayScore(k)===12;}
function goldDaysInWeek(w){var c=0;for(var i=0;i<7;i++)if(isGoldDay(key(addDays(w,i))))c++;return c;}
function isGoldWeek(w){return goldDaysInWeek(w)>=(+S.settings.goldWeek||5);}

function yesNo(f,val){return '<div class="chips">'+chip(f,"1","Da",val===true,"bool")+chip(f,"0","Nu",val===false,"bool")+'</div>';}

function stepper(f,val,step,min,max,unit){return '<div class="stepper"><button data-act="step" data-f="'+f+'" data-d="'+(-step)+'" data-min="'+min+'" data-max="'+max+'" aria-label="Mai puțin">'+MINUS+'</button><span>'+(val||0)+(unit?" "+unit:"")+'</span><button data-act="step" data-f="'+f+'" data-d="'+step+'" data-min="'+min+'" data-max="'+max+'" aria-label="Mai mult">'+PLUS+'</button></div>';}

function near(t,deltas){var b=t2m(t);return deltas.map(function(d){var m=((b+d)%1440+1440)%1440;return pad(Math.floor(m/60))+":"+pad(m%60);});}

   break;

 case"h6":h='<div class="q">Minute de mișcare</div>'+stepper("move",r.move,5,0,300,"min")+check("before7",r.before7!==false,"Înainte de "+fmtT(t.moveBy));break;
 case"h7":h='<div class="q">Minute pe social media</div><div class="chips">'+[15,30,45,60,90,120].map(function(s){return chip("social",s,s===120?"120+":s,r.social===s,"num");}).join("")+'</div><div style="margin-top:8px">'+stepper("social",r.social,5,0,600,"min")+'</div>';break;
 case"h8":h='<div class="q">Protocolul R ținut</div>'+yesNo("pr",r.pr);break;
 case"h9":m=r.meals||{};h=check("meals.prep",!!m.prep,"Masa pregătită de seara")+check("meals.snack",!!m.snack,"Fără gustări între mese")+check("meals.sugar",!!m.sugar,"Fără zahăr")+check("meals.pastry",!!m.pastry,"Fără patiserie");break;
 case"h10":h=yesNo("job",r.job)+'<div class="q">Tipul zilei</div><div class="chips">'+["Vizite","Admin","Planificare"].map(function(x){return chip("jobType",x,x,r.jobType===x);}).join("")+'</div>';break;
 case"h11":h=yesNo("spend",r.spend)+'<label class="tline">Neplanificat azi (£) <input type="number" inputmode="decimal" min="0" step="0.01" data-f="amount" value="'+(r.amount!=null?r.amount:"")+'" style="width:110px"></label>';
   if(r.amount>0)h+='<div class="hint">O sumă neplanificată înseamnă că ziua nu e ținută.</div>';break;

function habitCard(id,r){return '<div class="habit" id="c-'+id+'"><div class="hh"><span class="dot'+(done(id,r)?" on":"")+'" id="d-'+id+'">'+TICK+'</span><span class="hn">'+esc(label(id))+'</span></div><div id="b-'+id+'">'+body(id,r)+'</div></div>';}

function wakeHTML(r){var j=r.journal||{},w=r.wake||[],h='<h3>Cu ce te trezești azi</h3>',items=[];

}

 else if(b.dataset.act==="now"){setPath(r,f,nowT());}

/* streaks */
function curStreak(id){var d=today();if(!done(id,rec(key(d))))d=addDays(d,-1);var c=0;while(done(id,rec(key(d)))){c++;d=addDays(d,-1);}return c;}
function bestStreak(id){var ks=Object.keys(S.records).sort();if(!ks.length)return 0;var d=parse(ks[0]),end=parse(ks[ks.length-1]),b=0,run=0;
 while(d<=end){if(done(id,rec(key(d)))){run++;if(run>b)b=run;}else run=0;d=addDays(d,1);}return b;}
function weekCount(id,w){var c=0;for(var i=0;i<7;i++)if(done(id,rec(key(addDays(w,i)))))c++;return c;}
function runStats(test){var ks=Object.keys(S.records).sort();if(!ks.length)return {total:0,best:0,cur:0};
 var d=parse(ks[0]),end=parse(ks[ks.length-1]),tk=key(today());if(key(end)<tk)end=today();var tot=0,best=0,run=0;
 while(d<=end){var k=key(d);if(test(k)){tot++;run++;if(run>best)best=run;}else if(k<=tk)run=0;d=addDays(d,1);}
 var c=0,x=today();if(!test(key(x)))x=addDays(x,-1);while(test(key(x))){c++;x=addDays(x,-1);}
 return {total:tot,best:best,cur:c};}
function goldWeeksStats(){var ks=Object.keys(S.records).sort();if(!ks.length)return {total:0,best:0};
 var w=monday(parse(ks[0])),end=monday(today()),tot=0,best=0,run=0;
 while(w<=end){if(isGoldWeek(w)){tot++;run++;if(run>best)best=run;}else run=0;w=addDays(w,7);}return {total:tot,best:best};}

 [0,3,6,9,12].forEach(function(y){var yy=H-pb-ih*y/12;s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" stroke="#E7DDCB"/><text x="'+(pl-5)+'" y="'+(yy+4)+'" font-size="10" fill="#8A7B63" text-anchor="end">'+y+'</text>';});
 for(var i=0;i<7;i++){var d=addDays(ws,i),k=key(d),x=pl+i*cw+cw*.17,bw=cw*.66,y=H-pb,tot=0,cx=x+bw/2;
  GROUPS.forEach(function(g){var c=groupScore(g,k);if(!c)return;var hh=ih*c/12;y-=hh;tot+=c;s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+hh+'" fill="'+g.color+'" stroke="'+(c===3?"#F3DDAA":"#FFFDF8")+'" stroke-width="'+(c===3?2:1)+'"><title>'+g.name+": "+c+" din 3</title></rect>";});
  if(tot===12)s+=sunMark(cx,y-11,6);else if(tot)s+='<text x="'+cx+'" y="'+(y-4)+'" font-size="11" fill="#1F3A4D" text-anchor="middle">'+tot+'</text>';
  s+='<text x="'+cx+'" y="'+(H-pb+15)+'" font-size="12" font-weight="'+(k===tk?700:400)+'" fill="#1F3A4D" text-anchor="middle">'+ZILE[i]+'</text><text x="'+cx+'" y="'+(H-pb+28)+'" font-size="10" fill="#8A7B63" text-anchor="middle">'+d.getDate()+'</text>';
  GROUPS.forEach(function(g,gi){var on=isGoldG(g,k);s+='<circle class="gdot'+(on?" on":"")+'" cx="'+(cx-10.5+gi*7)+'" cy="'+(H-pb+40)+'" r="2.8" fill="'+(on?"#D9A441":"#E7DDCB")+'"><title>'+esc(goldName(g.id))+'</title></circle>';});}
 return s+'</svg><div class="legend">'+GROUPS.map(function(g){return '<span><i style="background:'+g.color+'"></i>'+g.name+'</span>';}).join("")+'<span><i style="background:#D9A441;border-radius:50%"></i>punct de aur pe grupă</span></div>';}
function goldWeekCard(){var tk=key(today()),gdays=goldDaysInWeek(ws),need=+S.settings.goldWeek||5;

function collectionCard(){var rows=GROUPS.map(function(g){return [goldName(g.id),runStats(function(k){return isGoldG(g,k);})];}).concat([[goldName("day"),runStats(isGoldDay)]]);

function barChart(id,vals,o){var W=360,H=190,pl=40,pb=30,pt=18,pr=6,cw=(W-pl-pr)/7,ih=H-pb-pt,tk=key(today());
 var nums=vals.filter(function(v){return v!=null;}),base=o.base||0,top=Math.max(o.target*1.4,nums.length?Math.max.apply(null,nums):0,base+1);
 if(o.base!=null){base=Math.min(o.base,nums.length?Math.min.apply(null,nums)-15:o.base);top=Math.max(o.target+90,nums.length?Math.max.apply(null,nums)+20:0);}
 function Y(v){return H-pb-ih*(v-base)/(top-base);}

 for(var i=0;i<7;i++){var x=pl+i*cw+cw*.2,bw=cw*.6,val=vals[i],k=key(addDays(ws,i));
  if(val!=null){var y=Y(val),ok=o.lower?val<=o.target:val>=o.target;s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(H-pb-y,2)+'" rx="4" fill="'+(ok?"#1F3A4D":"#8A7B63")+'"/><text x="'+(x+bw/2)+'" y="'+(y-4)+'" font-size="10" fill="#1F3A4D" text-anchor="middle">'+o.fmt(val)+'</text>';}
  s+='<text x="'+(x+bw/2)+'" y="'+(H-pb+15)+'" font-size="11" font-weight="'+(k===tk?700:400)+'" fill="#1F3A4D" text-anchor="middle">'+ZILE[i]+'</text>';}
 var ty=Y(o.target);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+ty+'" y2="'+ty+'" stroke="#D9A441" stroke-width="2" stroke-dasharray="5 4"/><text x="'+(W-pr)+'" y="'+(ty-4)+'" font-size="10" fill="#9a6f1f" text-anchor="end">ținta '+o.fmt(o.target)+'</text>';
 return s+'</svg>';}

 var gcount=function(g){var c=0;for(var j=0;j<7;j++)if(isGoldG(g,key(addDays(ws,j))))c++;return c;};
 var rows=[
  ["Nopți ținute",cnt("h1")+" din 7"],["Ora medie la somn",sl.length?m2t(sum(sl)/sl.length):"fără date"],

  [esc(S.settings.business)+", total",(sum(biz)/60).toFixed(1).replace(".",",")+" ore"],[esc(S.settings.business)+", zile ținute",cnt("h12")+" din 7"]]
  .concat(GROUPS.map(function(g){return [esc(goldName(g.id)),gcount(g)+" din 7"];}))
  .concat([[esc(goldName("day")),goldDaysInWeek(ws)+" din 7"]]);
 h+='<div class="card span2"><h2 class="title">Totaluri pe săptămână</h2><table class="tot" id="totals">'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join("")+'</table></div>';

  [["seara","Seara de dinainte, 3 din 3"],["dim","Dimineața, 3 din 3"],["zi","Câștig ziua, 3 din 3"],["job","Job, bani și business, 3 din 3"],["day","Toate 12 din 12"],["week","Săptămâna"]].map(function(x){
   return '<div class="set"><label>'+x[1]+'</label><input type="text" data-s="gold.'+x[0]+'" value="'+esc(s.gold&&s.gold[x[0]]!==DEF_GOLD[x[0]]?s.gold[x[0]]:"")+'" placeholder="'+esc(DEF_GOLD[x[0]])+'" maxlength="40"></div>';}).join("")+
  nset("goldWeek",s.goldWeek||5,"Zile de aur pentru „"+esc(goldName("week"))+"”",1,1,7)+'</div>';
 h+='<div class="card"><h2 class="title">Numele obiceiurilor</h2><div class="hint" style="margin:0 0 6px">Lasă gol ca să folosești numele de bază.</div>';
 ALL.forEach(function(id,i){h+='<div class="set"><label>'+(i+1)+'.</label><input type="text" data-s="labels.'+id+'" value="'+esc(s.labels[id]||"")+'" placeholder="'+esc(defLabel(id))+'" maxlength="80"></div>';});
 h+='</div><div class="card"><h2 class="title">Copie de siguranță</h2><div class="hint" style="margin:0 0 10px">Exportă din când în când un fișier JSON, chiar dacă folosești sincronizarea.</div><div class="row"><button class="btn gold" id="exp">Exportă JSON</button><button class="btn ghost" id="imp">Importă JSON</button></div></div>';
 h+='<footer>Obiceiurile mele · versiunea 2 · funcționează și fără internet</footer>';
 root.innerHTML=h;
 Array.prototype.forEach.call(root.querySelectorAll("[data-s]"),function(el){el.addEventListener(el.type==="time"?"change":"input",function(){
  var v=el.value,p=el.dataset.s;if(el.type==="time"&&!v)return;
  if(p.indexOf("labels.")===0||p.indexOf("gold.")===0)setPath(S.settings,p,v.trim()?v:undefined);else setPath(S.settings,p,v);

 Array.prototype.forEach.call(root.querySelectorAll("[data-sstep]"),function(b){b.onclick=function(){var p=b.dataset.sstep,v=Math.min(+b.dataset.max,Math.max(+b.dataset.min,(+getPath(S.settings,p)||0)+(+b.dataset.d)));setPath(S.settings,p,v);touchSettings();save();b.parentNode.querySelector("span").textContent=v;renderLabelsPh();};});
 document.getElementById("exp").onclick=exportJSON;document.getElementById("imp").onclick=function(){document.getElementById("importFile").click();};
 document.getElementById("syncshow").onclick=function(){var i=document.getElementById("synccode");i.type=i.type==="password"?"text":"password";this.textContent=i.type==="password"?"Arată codul":"Ascunde codul";};

  if(c.length<12){setSync("err","Codul trebuie să aibă cel puțin 12 caractere.");return;}

   Object.keys(s.records).forEach(function(k){if(s.records[k]&&typeof s.records[k]==="object")s.records[k].updatedAt=now;});s.settingsUpdatedAt=now;S=s;save();render();toast("Datele au fost importate");}}

/* sincronizare */
var SK="johnObiceiuri.sync";
var SY=(function(){try{return JSON.parse(localStorage.getItem(SK))||{};}catch(e){return {};}})();
var syncState={kind:SY.code?"idle":"none",msg:""},syncTimer=null,syncing=false,syncAgain=false,lastAuto=0;
function saveSync(){localStorage.setItem(SK,JSON.stringify(SY));}
function hhmm(ts){var d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes());}
function syncText(){if(syncState.msg)return syncState.msg;
 if(!SY.code)return "Sincronizarea nu e pornită. Datele stau doar pe acest dispozitiv.";
 if(SY.pending&&!navigator.onLine)return "Fără internet. Modificările se trimit când revine conexiunea.";
 return SY.last?"Ultima sincronizare la "+hhmm(SY.last)+(SY.pending?". Ai modificări netrimise.":""):"Încă nesincronizat.";}
function setSync(kind,msg){syncState={kind:kind,msg:msg||""};var st=document.getElementById("syncStatus");if(st)st.textContent=syncText();
 var ind=document.getElementById("syncInd");if(ind){ind.className=kind==="err"?"err":"";ind.textContent=!SY.code?"":kind==="busy"?"Se sincronizează":kind==="err"||kind==="off"?"Nesincronizat":SY.last?"Sincronizat la "+hhmm(SY.last):"";}}
function schedSync(){if(!SY.code)return;SY.pending=true;saveSync();clearTimeout(syncTimer);if(navigator.onLine)syncTimer=setTimeout(syncNow,2000);else setSync("off","Fără internet. Modificările se trimit când revine conexiunea.");}
function isObj(o){return o&&typeof o==="object"&&!Array.isArray(o);}
function mergeState(a,b){a=isObj(a)?a:{};b=isObj(b)?b:{};var ra=isObj(a.records)?a.records:{},rb=isObj(b.records)?b.records:{},out={};
 Object.keys(ra).concat(Object.keys(rb)).forEach(function(k){var x=ra[k],y=rb[k];if(!isObj(y))out[k]=x;else if(!isObj(x))out[k]=y;else out[k]=(y.updatedAt||0)>(x.updatedAt||0)?y:x;});
 var sa=a.settingsUpdatedAt||0,sb=b.settingsUpdatedAt||0;
 return {records:out,settings:sb>sa?b.settings:a.settings,settingsUpdatedAt:Math.max(sa,sb)};}
function syncNow(manual){
 if(!SY.code){setSync("none","");return Promise.resolve();}
 if(!navigator.onLine){setSync("off","Fără internet. Modificările se trimit când revine conexiunea.");return Promise.resolve();}
 if(syncing){syncAgain=true;return Promise.resolve();}
 syncing=true;clearTimeout(syncTimer);setSync("busy","Se sincronizează.");lastAuto=Date.now();
 var sentAt=Date.now(),body=JSON.stringify({version:3,records:S.records,settings:S.settings,settingsUpdatedAt:S.settingsUpdatedAt||0,updatedAt:S.updatedAt||0});
 return fetch("/.netlify/functions/sync",{method:"PUT",headers:{"content-type":"application/json","x-sync-code":SY.code},body:body,cache:"no-store"})
 .then(function(res){return res.json().catch(function(){return {};}).then(function(j){if(!res.ok){var er=new Error("http");er.j=j;er.status=res.status;throw er;}return j;});})
 .then(function(j){var before=JSON.stringify([S.records,S.settings]);var m=mergeState(S,j.state);
  S.records=m.records;S.settings=merge(JSON.parse(JSON.stringify(DEF_SETTINGS)),m.settings||{});S.settingsUpdatedAt=m.settingsUpdatedAt;
  localStorage.setItem(KEY,JSON.stringify(S));
  SY.last=Date.now();if(!((S.updatedAt||0)>sentAt))SY.pending=false;saveSync();setSync("ok","");
  if(manual===true)toast("Sincronizat");
  if(JSON.stringify([S.records,S.settings])!==before)softRender();})
 .catch(function(e){if(e&&e.j&&e.j.error==="cod_scurt")setSync("err","Codul trebuie să aibă cel puțin 12 caractere.");
  else if(!navigator.onLine)setSync("off","Fără internet. Modificările se trimit când revine conexiunea.");
  else setSync("err","Sincronizarea nu a reușit. Reîncerc mai târziu."+(SY.last?" Ultima reușită la "+hhmm(SY.last)+".":""));})
 .then(function(){syncing=false;if(syncAgain||SY.pending&&syncState.kind==="ok"){syncAgain=false;schedSync();}});}
var pendingRender=false;
function softRender(){var a=document.activeElement;if(a&&(a.type==="text"||a.type==="number"||a.type==="password")&&V().contains(a)){pendingRender=true;return;}
 var y=window.scrollY;render();window.scrollTo(0,y);}
document.addEventListener("focusout",function(){if(pendingRender){setTimeout(function(){var a=document.activeElement;if(a&&(a.type==="text"||a.type==="number"||a.type==="password"))return;pendingRender=false;var y=window.scrollY;render();window.scrollTo(0,y);},50);}});
window.addEventListener("online",function(){syncNow();});
window.addEventListener("offline",function(){if(SY.code)setSync("off","Fără internet. Modificările se trimit când revine conexiunea.");});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&SY.code&&Date.now()-lastAuto>30000)syncNow();});
